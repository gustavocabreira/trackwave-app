services:
  nginx:
    image: nginx
    ports:
      - 80:80
    volumes:
      - ../../dist:/var/www/
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    restart: unless-stopped
    networks:
      - internal
      - spa

networks:
  internal:
    driver: bridge
  spa:
    external: true
